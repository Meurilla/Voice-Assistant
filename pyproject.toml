[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-assistant"
version = "0.1.0"
description = "Phase 1 text-first command-line assistant scaffold."
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0,<2.0",
]

[project.optional-dependencies]
# Tests use Python's unittest; Ruff is the only external Phase 1 development tool.
dev = [
  "ruff>=0.8,<1",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "interfaces*", "providers*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
